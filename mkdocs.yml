site_name: Mamba HiFi-GAN
site_description: >-
  A search for where a bidirectional state-space model helps a GAN vocoder and where it breaks: 26 training runs
  over 19 ways of combining Mamba with HiFi-GAN's multi-receptive-field module, on LJSpeech.
site_url: https://hkaraca.com/mamba-hifigan/
repo_url: https://github.com/huseyin-karaca/mamba-hifigan
repo_name: huseyin-karaca/mamba-hifigan
copyright: Code Apache-2.0 · text and figures CC BY 4.0
theme:
  name: material
  custom_dir: overrides
  logo: assets/favicon.svg         # tab icons: bin/make_icons.py in the hkaraca.com repo
  favicon: assets/favicon.svg
  font: false                      # Schibsted Grotesk and JetBrains Mono come from docs/stylesheets/extra.css
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - content.tabs.link
nav:
  - Home: index.md
  - Method: method.md
  - Results: results.md
  - Listen: listen.md
  - Every run: experiments.md
  - Reproduce: reproduce.md
exclude_docs: |
  snippets/
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - javascripts/epochs.js
markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.blocks.tab:
      alternate_style: true
  - pymdownx.snippets:
      base_path: [docs]
      check_paths: true
extra:
  social:
    - icon: fontawesome/solid/house
      link: https://hkaraca.com/
      name: Huseyin Karaca
