</svg>

<figcaption>
One upsampling stage of the gated generator. The transposed convolution feeds both branches at the same
resolution: the Bidirectional Mamba block for global structure, the multi-receptive-field module for local
texture. A single learnable scalar per stage, squashed by a sigmoid, sets how much of each goes through. It
is initialised to 0, so training begins at an even split and the network moves the balance itself.
</figcaption>
</figure>
